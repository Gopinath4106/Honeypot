{% extends "base.html" %}

{% block title %}Error {{ error_code }}{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center py-5">
    <div class="sec-card text-center p-5 col-md-8 col-lg-6">
        <div class="text-danger mb-3">
            <i class="bi bi-exclamation-triangle-fill fs-1"></i>
        </div>
        <h1 class="display-4 fw-bold text-light mb-2">{{ error_code }}</h1>
        <h4 class="text-muted mb-4">{{ message }}</h4>
        <p class="text-secondary small mb-4">
            Security audit: All unhandled exceptions and unauthorized navigation attempts are recorded in internal system logs.
        </p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-info px-4 py-2">
            <i class="bi bi-house-door-fill me-2"></i>Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
